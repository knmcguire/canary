name: Hourly Canary Timestamp

# Gives the Rdev farm a fresh HEAD commit each hour (farm builds at :22).
#
# GitHub scheduled runs are best-effort and frequently skipped, so we schedule
# REDUNDANTLY (two slots/hour) and guard against double-commits: a heartbeat is
# only written if the previous one was >= MIN_GAP_MIN minutes ago. Net effect:
# at most one heartbeat per hour, but two chances for it to happen.

on:
  workflow_dispatch:
  schedule:
    - cron: '3 * * * *'   # primary, before the :22 farm build
    - cron: '33 * * * *'  # backup, covers a skipped :03 for the next hour

permissions:
  contents: write

concurrency:
  group: hourly-timestamp
  cancel-in-progress: false

jobs:
  bump:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2   # need the last commit's time for the guard

      - name: Heartbeat if an hour has elapsed
        env:
          MARKER_START: "<!-- CANARY_TIMESTAMP:START -->"
          MARKER_END: "<!-- CANARY_TIMESTAMP:END -->"
          MIN_GAP_MIN: '55'   # minutes since last heartbeat before writing again
        run: |
          set -euo pipefail

          NOW_EPOCH="$(date -u +%s)"

          # --- Guard: when was the last heartbeat commit? ---
          # Look at the most recent commit that was itself a heartbeat. If it's
          # newer than MIN_GAP_MIN, this run is a redundant slot -> skip.
          LAST_HB_EPOCH="$(git log -1 --grep='canary heartbeat' --format='%ct' 2>/dev/null || true)"
          if [ -n "$LAST_HB_EPOCH" ]; then
            AGE_MIN=$(( (NOW_EPOCH - LAST_HB_EPOCH) / 60 ))
            echo "Last heartbeat was ${AGE_MIN} min ago (threshold ${MIN_GAP_MIN})."
            if [ "$AGE_MIN" -lt "$MIN_GAP_MIN" ]; then
              echo "Too soon — this is a redundant slot. Skipping."
              exit 0
            fi
          else
            echo "No previous heartbeat found — proceeding with first one."
          fi

          # --- Write the new timestamp ---
          TS="$(date -u '+%Y-%m-%d %H:%M:%S UTC')"
          LINE="_Canary heartbeat: ${TS}_"

          [ -f README.md ] || touch README.md

          if ! grep -qF "$MARKER_START" README.md; then
            {
              echo ""
              echo "$MARKER_START"
              echo "$LINE"
              echo "$MARKER_END"
            } >> README.md
          else
            awk -v s="$MARKER_START" -v e="$MARKER_END" -v line="$LINE" '
              $0 == s { print; print line; skip = 1; next }
              $0 == e { skip = 0 }
              skip    { next }
                      { print }
            ' README.md > README.md.tmp
            mv README.md.tmp README.md
          fi

          if git diff --quiet; then
            echo "No change to commit."
            exit 0
          fi

          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md
          git commit -m "chore: canary heartbeat ${TS}"
          git push
