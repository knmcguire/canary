name: Hourly Canary Timestamp

# Bumps a timestamp in the README once an hour so the Rdev build farm has a
# fresh HEAD commit to build at :22. Scheduled at :05 to leave margin for
# GitHub's cron drift (scheduled runs can lag well past their nominal minute).

on:
  workflow_dispatch:
  schedule:
    - cron: '5 * * * *'  # :05 every hour — safely before the :22 farm run

permissions:
  contents: write        # required to push the commit

concurrency:
  group: hourly-timestamp
  cancel-in-progress: false

jobs:
  bump:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Update timestamp and commit
        env:
          MARKER_START: "<!-- CANARY_TIMESTAMP:START -->"
          MARKER_END: "<!-- CANARY_TIMESTAMP:END -->"
        run: |
          set -euo pipefail

          TS="$(date -u '+%Y-%m-%d %H:%M:%S UTC')"
          LINE="_Canary heartbeat: ${TS}_"

          [ -f README.md ] || touch README.md

          if ! grep -qF "$MARKER_START" README.md; then
            # First run: append a fresh marker block.
            {
              echo ""
              echo "$MARKER_START"
              echo "$LINE"
              echo "$MARKER_END"
            } >> README.md
          else
            # Replace everything between the markers with the new line.
            awk -v s="$MARKER_START" -v e="$MARKER_END" -v line="$LINE" '
              $0 == s { print; print line; skip = 1; next }
              $0 == e { skip = 0 }
              skip    { next }
                      { print }
            ' README.md > README.md.tmp
            mv README.md.tmp README.md
          fi

          if git diff --quiet; then
            echo "No change to commit."
            exit 0
          fi

          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md
          git commit -m "chore: canary heartbeat ${TS}"
          git push
