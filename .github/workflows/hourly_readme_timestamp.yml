name: Hourly Canary Timestamp

# Bumps a timestamp in the README once an hour so the Rdev build farm has a
# fresh HEAD commit to build at :22. Scheduled at :05 to leave margin for
# GitHub's cron drift (scheduled runs can lag well past their nominal minute).

on:
  workflow_dispatch:
  schedule:
    - cron: '5 * * * *'  # :05 every hour — safely before the :22 farm run

permissions:
  contents: write        # required to push the commit

concurrency:
  group: hourly-timestamp
  cancel-in-progress: false

jobs:
  bump:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Update timestamp and commit
        run: |
          set -euo pipefail

          TS="$(date -u '+%Y-%m-%d %H:%M:%S UTC')"
          MARKER_START="<!-- CANARY_TIMESTAMP:START -->"
          MARKER_END="<!-- CANARY_TIMESTAMP:END -->"
          LINE="_Canary heartbeat: ${TS}_"

          # Ensure the marker block exists in README.md; create/append if missing.
          if [ ! -f README.md ]; then
            touch README.md
          fi
          if ! grep -q "$MARKER_START" README.md; then
            {
              echo ""
              echo "$MARKER_START"
              echo "$LINE"
              echo "$MARKER_END"
            } >> README.md
          else
            # Replace whatever is between the markers with the new line.
            python3 - "$MARKER_START" "$MARKER_END" "$LINE" << 'PY'
import re, sys
start, end, line = sys.argv[1], sys.argv[2], sys.argv[3]
with open("README.md", "r", encoding="utf-8") as f:
    text = f.read()
pattern = re.compile(re.escape(start) + r".*?" + re.escape(end), re.DOTALL)
text = pattern.sub(f"{start}\n{line}\n{end}", text)
with open("README.md", "w", encoding="utf-8") as f:
    f.write(text)
PY
          fi

          # Commit only if something actually changed.
          if git diff --quiet; then
            echo "No change to commit."
            exit 0
          fi

          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md
          git commit -m "chore: canary heartbeat ${TS}"
          git push
