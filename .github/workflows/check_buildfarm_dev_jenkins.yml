name: ROS2 Build Farm Canary

# The canary repo's code never changes; commits just poke the Rdev job, which
# builds HEAD once an hour (at :22). So a build FAILURE means the BUILD FARM is
# broken, not our code. This workflow reports each build as farm-pass / farm-fail
# and how long after the commit the farm actually ran it.

on:
  workflow_dispatch:
  schedule:
    - cron: '0 * * * *'  # hourly

jobs:
  summary:
    runs-on: ubuntu-latest
    steps:
      - name: Build farm canary summary
        env:
          JOB_URL: https://build.ros2.org/job/Rdev__canary__ubuntu_resolute_amd64
          REPO: knmcguire/canary          # owner/name, for commit timestamps
          MAX_BUILDS: '20'
          GH_TOKEN: ${{ github.token }}    # used only to read commit times
        run: |
          set +e
          set -uo pipefail

          # --- 1. Fetch builds (number, result, timestamp, built SHA) ---
          API="${JOB_URL}/api/json?tree=builds[number,result,timestamp,building,actions[lastBuiltRevision[SHA1]]]{0,${MAX_BUILDS}}"
          echo "Fetching: $API"
          HTTP=$(curl -sg -o response.json -w '%{http_code}' "$API")
          echo "HTTP status: $HTTP"

          if [ "$HTTP" != "200" ] || ! jq empty response.json 2>/dev/null; then
            echo "::error::Jenkins API fetch failed (HTTP $HTTP)"
            head -c 500 response.json; echo
            exit 1
          fi
          echo "Builds found: $(jq '.builds | length' response.json)"

          # --- 2. Flatten to: number<TAB>result<TAB>timestamp<TAB>sha ---
          jq -r '
            .builds[]
            | . as $b
            | ( [ .actions[]? | .lastBuiltRevision?.SHA1 // empty ] | first ) as $sha
            | [ ($b.number|tostring),
                ($b.result // (if $b.building then "BUILDING" else "UNKNOWN" end)),
                ($b.timestamp|tostring),
                ($sha // "") ] | @tsv
          ' response.json > builds.tsv

          # --- helper: commit unix timestamp from the GitHub API (blank on miss) ---
          commit_ts_of() {
            local sha="$1"
            [ -z "$sha" ] && { echo ""; return; }
            curl -sf \
              -H "Authorization: Bearer $GH_TOKEN" \
              -H "Accept: application/vnd.github+json" \
              "https://api.github.com/repos/${REPO}/commits/${sha}" \
              | jq -r '.commit.committer.date // empty' \
              | { read -r d; [ -n "$d" ] && date -u -d "$d" +%s || echo ""; }
          }

          # --- 3. Header ---
          {
            echo "## ROS2 Build Farm Canary"
            echo ""
            echo "Job: [\`Rdev__canary__ubuntu_resolute_amd64\`](${JOB_URL}/)"
            echo ""
            echo "Each build tests HEAD at the top of the hour (:22). A failure means"
            echo "the **build farm** is broken, not the canary code."
            echo ""
            echo "Legend: ✅ farm OK · 🔁 farm failure · ⏳ running · ⚠️ other"
            echo ""
            echo "| Build | Result | Commit | Ran (UTC) | Latency |"
            echo "|-------|--------|--------|-----------|---------|"
          } >> "$GITHUB_STEP_SUMMARY"

          n_ok=0; n_fail=0

          # --- 4. One row per build (newest first, as returned) ---
          while IFS=$'\t' read -r num result ts sha; do
            [ -z "$num" ] && continue

            build_ts=$((ts/1000))
            build_date=$(date -u -d "@$build_ts" '+%Y-%m-%d %H:%M')
            short="${sha:0:8}"; [ -z "$short" ] && short="—"

            case "$result" in
              SUCCESS)          icon="✅ OK";           n_ok=$((n_ok+1));;
              FAILURE|UNSTABLE) icon="🔁 farm failure"; n_fail=$((n_fail+1));;
              BUILDING)         icon="⏳ running";;
              *)                icon="⚠️ $result";;
            esac

            # Latency: build time - commit time (blank if commit not found)
            latency="—"
            cts=$(commit_ts_of "$sha")
            if [ -n "$cts" ]; then
              d=$((build_ts - cts)); [ "$d" -lt 0 ] && d=0
              latency=$(printf '%dh %dm' $((d/3600)) $(((d%3600)/60)))
            fi

            printf '| [#%s](%s/%s/) | %s | `%s` | %s | %s |\n' \
              "$num" "$JOB_URL" "$num" "$icon" "$short" "$build_date" "$latency" \
              >> "$GITHUB_STEP_SUMMARY"
          done < builds.tsv

          # --- 5. Totals ---
          {
            echo ""
            echo "**Farm health:** ✅ $n_ok OK · 🔁 $n_fail failing"
          } >> "$GITHUB_STEP_SUMMARY"
