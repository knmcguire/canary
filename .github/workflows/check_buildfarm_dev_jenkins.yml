name: ROS2 Build Farm Canary

# Daily rollup of the Rdev build farm canary. The canary code never changes;
# each commit just pokes the Rdev job, which builds HEAD hourly (at :22). A
# build FAILURE therefore means the BUILD FARM is broken, not our code.
#
# Runs once a day at an off-peak UTC slot (06:17 — odd minute, mid-morning UTC,
# away from the top-of-hour / midnight congestion that makes GitHub cron skip
# runs) and reports on YESTERDAY's complete 24h window.

on:
  workflow_dispatch:
  schedule:
    - cron: '17 6 * * *'  # 06:17 UTC daily — off-peak, better odds of firing

jobs:
  summary:
    runs-on: ubuntu-latest
    steps:
      - name: Daily build farm canary summary
        env:
          JOB_URL: https://build.ros2.org/job/Rdev__canary__ubuntu_resolute_amd64
          REPO: knmcguire/canary          # owner/name, for commit timestamps
          MAX_BUILDS: '50'                 # enough to cover a day of hourly builds
          GH_TOKEN: ${{ github.token }}    # used only to read commit times
        run: |
          set +e
          set -uo pipefail

          # --- Window: yesterday 00:00:00 .. 23:59:59 UTC ---
          DAY="$(date -u -d 'yesterday' '+%Y-%m-%d')"
          START_MS=$(( $(date -u -d "${DAY} 00:00:00" +%s) * 1000 ))
          END_MS=$((   $(date -u -d "${DAY} 23:59:59" +%s) * 1000 ))
          echo "Reporting on ${DAY} (UTC): ${START_MS}..${END_MS}"

          # --- 1. Fetch builds (number, result, timestamp, built SHA) ---
          API="${JOB_URL}/api/json?tree=builds[number,result,timestamp,building,actions[lastBuiltRevision[SHA1]]]{0,${MAX_BUILDS}}"
          echo "Fetching: $API"
          HTTP=$(curl -sg -o response.json -w '%{http_code}' "$API")
          echo "HTTP status: $HTTP"

          if [ "$HTTP" != "200" ] || ! jq empty response.json 2>/dev/null; then
            echo "::error::Jenkins API fetch failed (HTTP $HTTP)"
            head -c 500 response.json; echo
            exit 1
          fi
          echo "Builds found (all): $(jq '.builds | length' response.json)"

          # --- 2. Flatten + filter to yesterday's window, oldest first ---
          jq -r --argjson start "$START_MS" --argjson end "$END_MS" '
            .builds[]
            | . as $b
            | ( [ .actions[]? | .lastBuiltRevision?.SHA1 // empty ] | first ) as $sha
            | select(($b.timestamp >= $start) and ($b.timestamp <= $end))
            | [ ($b.number|tostring),
                ($b.result // (if $b.building then "BUILDING" else "UNKNOWN" end)),
                ($b.timestamp|tostring),
                ($sha // "") ] | @tsv
          ' response.json | sort -t$'\t' -k3,3n > builds.tsv

          echo "Builds in window: $(wc -l < builds.tsv)"

          # --- helper: commit unix timestamp from the GitHub API (blank on miss) ---
          commit_ts_of() {
            local sha="$1"
            [ -z "$sha" ] && { echo ""; return; }
            curl -sf \
              -H "Authorization: Bearer $GH_TOKEN" \
              -H "Accept: application/vnd.github+json" \
              "https://api.github.com/repos/${REPO}/commits/${sha}" \
              | jq -r '.commit.committer.date // empty' \
              | { read -r d; [ -n "$d" ] && date -u -d "$d" +%s || echo ""; }
          }

          # --- 3. Header ---
          {
            echo "## ROS2 Build Farm Canary — ${DAY} (UTC)"
            echo ""
            echo "Job: [\`Rdev__canary__ubuntu_resolute_amd64\`](${JOB_URL}/)"
            echo ""
            echo "Each build tests HEAD hourly (:22). A failure means the **build farm**"
            echo "is broken, not the canary code."
            echo ""
            echo "Legend: ✅ farm OK · 🔁 farm failure · ⏳ running · ⚠️ other"
            echo ""
            echo "| Build | Result | Commit | Ran (UTC) | Latency |"
            echo "|-------|--------|--------|-----------|---------|"
          } >> "$GITHUB_STEP_SUMMARY"

          n_ok=0; n_fail=0; n_other=0

          # --- 4. One row per build in the window (oldest -> newest) ---
          while IFS=$'\t' read -r num result ts sha; do
            [ -z "$num" ] && continue

            build_ts=$((ts/1000))
            build_date=$(date -u -d "@$build_ts" '+%Y-%m-%d %H:%M')
            short="${sha:0:8}"; [ -z "$short" ] && short="—"

            case "$result" in
              SUCCESS)          icon="✅ OK";           n_ok=$((n_ok+1));;
              FAILURE|UNSTABLE) icon="🔁 farm failure"; n_fail=$((n_fail+1));;
              BUILDING)         icon="⏳ running";;
              *)                icon="⚠️ $result";      n_other=$((n_other+1));;
            esac

            latency="—"
            cts=$(commit_ts_of "$sha")
            if [ -n "$cts" ]; then
              d=$((build_ts - cts)); [ "$d" -lt 0 ] && d=0
              latency=$(printf '%dh %dm' $((d/3600)) $(((d%3600)/60)))
            fi

            printf '| [#%s](%s/%s/) | %s | `%s` | %s | %s |\n' \
              "$num" "$JOB_URL" "$num" "$icon" "$short" "$build_date" "$latency" \
              >> "$GITHUB_STEP_SUMMARY"
          done < builds.tsv

          # --- 5. Daily totals + success rate ---
          total=$((n_ok + n_fail))
          rate="n/a"
          if [ "$total" -gt 0 ]; then
            rate="$(awk -v a="$n_ok" -v b="$total" 'BEGIN{printf "%.0f%%", 100*a/b}')"
          fi
          {
            echo ""
            echo "**${DAY}:** ✅ ${n_ok} OK · 🔁 ${n_fail} farm failures out of ${total} builds → **${rate} success**"
          } >> "$GITHUB_STEP_SUMMARY"
