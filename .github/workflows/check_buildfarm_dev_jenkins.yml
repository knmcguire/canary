name: ROS2 Build Farm Summary

on:
  workflow_dispatch:
  schedule:
    - cron: '0 * * * *'  # hourly

jobs:
  summary:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 50  # enough history to match builds to commits

      - name: Build commit → build summary
        env:
          JOB_URL: https://build.ros2.org/job/Rdev__canary__ubuntu_resolute_amd64
          MAX_BUILDS: '20'   # how many recent builds to inspect
          MAX_COMMITS: '20'  # how many recent commits to report on
        run: |
          set +e            # explicitly turn OFF the -e that GitHub sets
          set -uo pipefail

          # --- 1. Fetch builds from Jenkins (one request) ---
          # -g disables curl globbing so the [ ] and { } in the URL are literal.
          API="${JOB_URL}/api/json?tree=builds[number,result,timestamp,building,actions[lastBuiltRevision[SHA1]]]{0,${MAX_BUILDS}}"
          echo "Fetching: $API"

          HTTP=$(curl -sg -o response.json -w '%{http_code}' "$API")
          echo "HTTP status: $HTTP"

          if [ "$HTTP" != "200" ]; then
            echo "::error::Jenkins API returned HTTP $HTTP"
            head -c 500 response.json; echo
            exit 1
          fi

          if ! jq empty response.json 2>/dev/null; then
            echo "::error::Response was not valid JSON"
            head -c 500 response.json; echo
            exit 1
          fi

          echo "Builds found: $(jq '.builds | length' response.json)"

          # --- 1b. Diagnostic: show what SHA the jq path extracts per build ---
          echo "=== extracted SHA per build (verify these are 40-char hashes) ==="
          jq '.builds[] | {number, result, sha: [.actions[]?|.lastBuiltRevision?.SHA1//empty]}' response.json

          # --- 2. Flatten each build into: sha<TAB>number<TAB>result<TAB>timestamp ---
          jq -r '
            .builds[]
            | . as $b
            | ( [ .actions[]? | .lastBuiltRevision?.SHA1 // empty ] | first ) as $sha
            | select($sha != null)
            | [ $sha,
                ($b.number|tostring),
                ($b.result // (if $b.building then "BUILDING" else "UNKNOWN" end)),
                ($b.timestamp|tostring) ] | @tsv
          ' response.json > builds.tsv

          # --- 3. Header for the summary ---
          {
            echo "## ROS2 Build Farm Summary"
            echo ""
            echo "Job: [\`Rdev__canary__ubuntu_resolute_amd64\`](${JOB_URL}/)"
            echo ""
            echo "| Commit | Committed (UTC) | Build | Status | Ran (UTC) | Latency |"
            echo "|--------|-----------------|-------|--------|-----------|---------|"
          } >> "$GITHUB_STEP_SUMMARY"

          n_success=0; n_fail=0; n_norun=0

          # --- 4. Walk recent commits, match each to ALL its builds ---
          for sha in $(git log -n "$MAX_COMMITS" --format='%H'); do
            short="${sha:0:8}"
            commit_ts=$(git show -s --format='%ct' "$sha")
            commit_date=$(date -u -d "@$commit_ts" '+%Y-%m-%d %H:%M')

            # ALL rows for this commit (a commit can be built more than once)
            rows=$(awk -F'\t' -v s="$sha" '$1==s {print}' builds.tsv)

            if [ -z "$rows" ]; then
              n_norun=$((n_norun+1))
              printf '| `%s` | %s | — | ⚪ no build | — | — |\n' \
                "$short" "$commit_date" >> "$GITHUB_STEP_SUMMARY"
              continue
            fi

            # Sort this commit's builds by timestamp (field 4) ascending,
            # so the earliest attempt drives the latency figure.
            rows=$(echo "$rows" | sort -t$'\t' -k4,4n)

            builds_cell=""; status_cell=""
            first_build_ts=""; c_ok=0; c_bad=0
            while IFS=$'\t' read -r r_sha r_num r_res r_ts; do
              [ -z "$r_num" ] && continue
              [ -z "$first_build_ts" ] && first_build_ts=$r_ts

              case "$r_res" in
                SUCCESS)          s="✅"; c_ok=$((c_ok+1));;
                FAILURE|UNSTABLE) s="❌"; c_bad=$((c_bad+1));;
                BUILDING)         s="⏳";;
                *)                s="⚠️";;
              esac
              builds_cell="${builds_cell}[#${r_num}](${JOB_URL}/${r_num}/) "
              status_cell="${status_cell}${s} "
            done <<< "$rows"

            # Commit-level rollup: any failure counts the commit as failed.
            if [ "$c_bad" -gt 0 ]; then
              n_fail=$((n_fail+1))
            elif [ "$c_ok" -gt 0 ]; then
              n_success=$((n_success+1))
            fi

            # Latency measured from commit to the FIRST build attempt.
            build_ts=$((first_build_ts/1000))
            build_date=$(date -u -d "@$build_ts" '+%Y-%m-%d %H:%M')
            latency_s=$((build_ts - commit_ts))
            if [ "$latency_s" -lt 0 ]; then latency_s=0; fi
            latency=$(printf '%dh %dm' $((latency_s/3600)) $(((latency_s%3600)/60)))

            printf '| `%s` | %s | %s | %s | %s | %s |\n' \
              "$short" "$commit_date" "$builds_cell" "$status_cell" \
              "$build_date" "$latency" >> "$GITHUB_STEP_SUMMARY"
          done

          # --- 5. Totals ---
          {
            echo ""
            echo "**Totals:** ✅ $n_success succeeded · ❌ $n_fail failed · ⚪ $n_norun no build"
          } >> "$GITHUB_STEP_SUMMARY"
